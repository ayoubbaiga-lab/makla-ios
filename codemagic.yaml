workflows:
  ios-makla:
    name: Makla iOS — App Store
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        BUNDLE_ID: "com.makla.app"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        APP_STORE_APP_ID: 6777566399
      node: 20.11.0
      xcode: 16.2
      cocoapods: 1.15.2
    integrations:
      app_store_connect: makla_api_key
    scripts:
      - name: Installer les dependances npm
        script: npm install
      - name: Ajouter la plateforme iOS
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios
      - name: Generer icones et splash
        script: npx capacitor-assets generate --ios || true
      - name: Installer les pods
        script: |
          cd ios/App && pod install
      - name: Definir la version de build (auto-increment)
        script: |
          cd ios/App
          agvtool new-version -all $(($(date +%s) / 60))
      - name: Nettoyer anciens certs + profils sur Apple
        script: |
          set -x
          echo "=== Liste des certificats Distribution existants ==="
          app-store-connect certificates list --type IOS_DISTRIBUTION --save || true

          echo "=== Suppression de tous les certificats Distribution existants ==="
          # Recupere les IDs et les supprime un par un
          for cert_id in $(app-store-connect certificates list --type IOS_DISTRIBUTION --json 2>/dev/null | python3 -c "import sys, json; data=json.load(sys.stdin); print('\n'.join(c['id'] for c in data))" 2>/dev/null); do
            echo "Suppression certificat $cert_id"
            app-store-connect certificates delete "$cert_id" --ignore-not-found || true
          done

          echo "=== Suppression des profils App Store existants pour $BUNDLE_ID ==="
          for prof_id in $(app-store-connect provisioning-profiles list --type IOS_APP_STORE --json 2>/dev/null | python3 -c "import sys, json; data=json.load(sys.stdin); print('\n'.join(p['id'] for p in data if 'com.makla.app' in p.get('attributes',{}).get('name','')))" 2>/dev/null); do
            echo "Suppression profil $prof_id"
            app-store-connect provisioning-profiles delete "$prof_id" --ignore-not-found || true
          done
      - name: Generer cle privee et nouveau certificat
        script: |
          set -e -x
          # Genere une cle privee RSA fraiche
          openssl genrsa -out /tmp/distribution.key 2048
          chmod 600 /tmp/distribution.key

          # Init keychain
          keychain initialize

          # Cree le certificat Distribution iOS lie a notre cle privee
          app-store-connect certificates create \
            --type IOS_DISTRIBUTION \
            --certificate-key=/tmp/distribution.key \
            --save

          # Cree le profil App Store pour notre Bundle ID
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=/tmp/distribution.key \
            --create

          # Ajoute le certificat au keychain
          keychain add-certificates

          # Configure le projet Xcode pour utiliser les profils
          xcode-project use-profiles
      - name: Build et archive
        script: |
          set -e
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
